server.port=8080
spring.application.name=lab-management-system

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/lab_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=5000ms

# JWT
jwt.secret=${JWT_SECRET:please-set-JWT_SECRET-env-var-in-production}
jwt.expiration=86400000

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=uploads

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.default-property-inclusion=non_null

# ===== DeepSeek AI 助手（受限问答）=====
# 安全：必须通过环境变量 DEEPSEEK_API_KEY 提供，切勿硬编码到仓库
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
deepseek.timeout-seconds=60
# 注入到提示词中的知识库检索条数与相似度门槛（关键词打分）
ai.knowledge.top-k=5
ai.knowledge.min-score=1
